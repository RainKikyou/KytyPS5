name: Fix compile errors
on:
  push:
    branches: [demo-merge-pr500-pr599]
    paths:
      - '.github/workflows/fix-compile-errors.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-merge-pr500-pr599
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Mode\* old_mode = nullptr) {/Mode* old_mode) {/' src/common/platform/sysLinuxVirtual.cpp src/common/platform/sysWindowsVirtual.cpp
          sed -i 's/EvaluateDescriptorSource(fixture\.program, 0, {}, result)/SrtWalker(fixture.program, {}).EvaluateDescriptor(0, result)/' tests/ScalarProvenanceTests.cpp
          echo "--- after fix ---"
          grep -n "bool Protect" src/common/platform/sysLinuxVirtual.cpp src/common/platform/sysWindowsVirtual.cpp
          grep -n "EvaluateDescriptorSource" tests/ScalarProvenanceTests.cpp || echo "EvaluateDescriptorSource removed"
          git config user.name "RainKikyou"
          git config user.email "RainKikyou@users.noreply.github.com"
          git add src/common/platform/sysLinuxVirtual.cpp src/common/platform/sysWindowsVirtual.cpp tests/ScalarProvenanceTests.cpp
          git commit -m "fix: drop duplicated default arg on Protect; use SrtWalker in bit-scan test"
          git push origin HEAD:demo-merge-pr500-pr599
