name: Merge PR 939 onto demo branch
on:
  workflow_dispatch:
  push:
    branches: [ demo-merge-pr500-pr599 ]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork demo branch
        uses: actions/checkout@v4
        with:
          repository: RainKikyou/KytyPS5
          ref: demo-merge-pr500-pr599
          path: repo
          fetch-depth: 0
      - name: Merge latest upstream main and PR 939
        shell: bash
        run: |
          set -e
          cd repo
          git config user.name "RainKikyou"
          git config user.email "RainKikyou@users.noreply.github.com"
          git remote add upstream https://github.com/KytyPS5/KytyPS5.git
          git fetch --no-tags upstream main
          git fetch --no-tags https://github.com/chenxiao07/KytyPS5.git docs/ai-optimization-skill
          ORIG_HEAD=$(git rev-parse HEAD)
          # Merge latest upstream mainline; on content conflicts take upstream (theirs),
          # on modify/delete conflicts also resolve by taking upstream's side.
          git merge --no-ff -X theirs upstream/main -m "Merge latest upstream mainline into demo-merge-pr500-pr599" || {
            for f in $(git diff --name-only --diff-filter=U); do
              if git ls-files -u -- "$f" | awk '{print $3}' | grep -q '^3$'; then
                git checkout --theirs -- "$f"
              else
                git rm -f -- "$f"
              fi
            done
            git add -A
            git commit -m "Merge latest upstream mainline into demo-merge-pr500-pr599 (resolve conflicts taking upstream)"
          }
          # Merge PR #939 docs (does not touch .github/workflows)
          git merge --no-ff -X theirs FETCH_HEAD -m "Merge PR #939: docs: add an AI development skill (reference)" || {
            for f in $(git diff --name-only --diff-filter=U); do
              if git ls-files -u -- "$f" | awk '{print $3}' | grep -q '^3$'; then
                git checkout --theirs -- "$f"
              else
                git rm -f -- "$f"
              fi
            done
            git add -A
            git commit -m "Merge PR #939: docs: add an AI development skill (reference)"
          }
          # Keep the fork's workflow files exactly as before the merge, so the push
          # contains no workflow file changes (GITHUB_TOKEN cannot push those).
          git checkout "$ORIG_HEAD" -- .github/workflows/
          git add -A .github/workflows/
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git log --oneline -6
      - name: Push to fork demo branch
        shell: bash
        run: |
          cd repo
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/RainKikyou/KytyPS5.git" HEAD:demo-merge-pr500-pr599
