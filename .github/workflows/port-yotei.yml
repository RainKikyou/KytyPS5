name: Port YOTEI branch

on:
  workflow_dispatch:
  push:
    branches: [demo-merge-pr500-pr599]
    paths:
      - '.github/workflows/port-yotei.yml'

permissions:
  contents: write
  actions: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Push YOTEI-BRANCH to fork as yotei
        shell: bash
        run: |
          set -euo pipefail
          git clone --single-branch --branch YOTEI-BRANCH https://github.com/peepostarexx/KytyPS5.git repo
          cd repo
          git remote add fork https://github.com/RainKikyou/KytyPS5.git
          git push fork YOTEI-BRANCH:refs/heads/yotei

      - name: Trigger build on yotei branch
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -sf -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
              -d '{"ref":"yotei"}'; then
              ok=1
              break
            fi
            echo "dispatch attempt $i failed; retry in 15s"
            sleep 15
          done
          test "$ok" -eq 1
