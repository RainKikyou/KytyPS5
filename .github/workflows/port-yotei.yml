name: Port YOTEI branch

on:
  workflow_dispatch:
  push:
    branches: [demo-merge-pr500-pr599]
    paths:
      - '.github/workflows/port-yotei.yml'

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Push YOTEI-BRANCH to fork as yotei (workflow files excluded)
        shell: bash
        run: |
          set -euo pipefail
          git clone --single-branch --branch YOTEI-BRANCH https://github.com/peepostarexx/KytyPS5.git repo
          cd repo
          git rm -r -q .github/workflows
          git -c user.name=RainKikyou -c user.email=RainKikyou@users.noreply.github.com commit -q -m "port-yotei: drop workflow files (GITHUB_TOKEN cannot push them)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" YOTEI-BRANCH:refs/heads/yotei
