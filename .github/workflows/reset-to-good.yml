name: Reset to good state
on:
  push:
    branches: [demo-merge-pr500-pr599]
    paths:
      - '.github/workflows/reset-to-good.yml'
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-merge-pr500-pr599
          fetch-depth: 0
      - name: Reset tree to 6fc433ee and keep PR939 docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RainKikyou"
          git config user.email "RainKikyou@users.noreply.github.com"
          mkdir -p /tmp/docs
          cp -a .claude /tmp/docs/ 2>/dev/null || true
          git read-tree -u --reset 6fc433ee
          rm -rf .claude
          mkdir -p .claude
          cp -a /tmp/docs/.claude/. .claude/ 2>/dev/null || true
          rm -f .github/workflows/merge-pr939-onto-demo.yml
          echo "--- workflows after reset ---"
          ls -la .github/workflows
          echo "--- .claude after restore ---"
          find .claude -type f | sort
          echo "--- build.yml line count ---"
          wc -l .github/workflows/build.yml
          git add -A
          git commit -m "Reset content to last good build state (6fc433ee); keep PR #939 docs"
          git push origin HEAD:demo-merge-pr500-pr599
